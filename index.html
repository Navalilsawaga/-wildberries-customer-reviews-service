<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы WB - Нижневартовск</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 0; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 414px; background-color: #ffffff; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); padding-bottom: 40px; }
        .header { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .wb-logo { background: linear-gradient(135deg, #cb11ab, #7b00ff); color: white; width: 40px; height: 40px; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 20px; margin-right: 15px; font-family: Arial, sans-serif; font-style: italic; }
        .header-title { font-size: 18px; font-weight: bold; color: #333; }
        .page-title { padding: 20px 15px 10px; font-size: 22px; font-weight: bold; color: #333; }
        .vpn-warning { margin: 0 15px 15px; padding: 12px 14px; background-color: #fff4e5; border: 1px solid #ffcc80; border-radius: 8px; font-size: 14px; color: #8a5300; line-height: 1.4; }
        .review-form { padding: 0 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #f9f9f9; outline: none; }
        .form-control:focus { border-color: #cb11ab; background-color: #fff; }
        textarea.form-control { resize: vertical; min-height: 100px; }
        .stars-container { display: flex; gap: 5px; font-size: 30px; cursor: pointer; color: #ccc; }
        .star.active { color: #ffcc00; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #cb11ab, #7b00ff); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; margin-bottom: 30px; }
        .submit-btn:active { opacity: 0.8; }
        .toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 15px; opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        .toast.show { visibility: visible; opacity: 1; bottom: 100px; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header">
        <div class="wb-logo">wb</div>
        <div class="header-title">Отзывы покупателей</div>
    </div>

    <div class="page-title">Пункт выдачи</div>

    <div class="vpn-warning">
        ⚠️ <b>Внимание!</b> Для корректной работы формы отзыва включите VPN. Без VPN отправка не сработает.
    </div>

    <div class="review-form">
        <div class="form-group">
            <label for="city">Выберите ПВЗ:</label>
            <select id="city" class="form-control">
                <option>ул. Интернациональная, д. 2г, Корпус 2</option>
                <option>ул. Северная 50Б</option>
                <option>ул. Профсоюзная,7</option>
                <option>ул. Пермская,5</option>
                <option>ст-ца Петровская, ул.Димитрова 27Б</option>
                <option>Адыгейск,ул. Шовгенова,31А</option>
                <option>г.Адыгейск,пр-т. Ленина,26Б/7</option>
                <option>Лянтор, 1-й микрорайон, 12</option>
                <option>Лянтор, 2-й микрорайон, 24/1</option>
                <option>Лянтор, 6-Й Микрорайон, 18</option>
                <option>Мегион, проспект Победы, 9</option>
                <option>Мегион, улица Строителей, 11/4</option>
                <option>Муравленко, Молодёжная улица, 1</option>
                <option>Муравленко, улица Ленина, 113</option>
                <option>Муравленко, улица Муравленко, 35А</option>
                <option>Нижневартовск, Молодёжная улица, 14</option>
                <option>посёлок городского типа Белый Яр, улица Симонова, 2А</option>
                <option>посёлок городского типа Высокий, Северная улица, 3/1</option>
                <option>посёлок городского типа Излучинск, Набережная улица, 21</option>
                <option>посёлок Нижнесортымский, Хантыйский переулок, 11</option>
                <option>поселок Ханымей, улица Нефтяников, 1/15</option>
                <option>Сургут, улица Александра Усольцева, 13</option>
                <option>Сургут, улица Крылова, 26</option>
                <option>Сургут, улица Майская 6</option>
                <option>Краснодар, улица Архитектора Петина, 18/2</option>
                <option>Краснодар, улица имени Героя Советского Союза Якова Кобзаря, 1</option>
                <option>Краснодар, улица имени 40-летия Победы, 60</option>
                <option>Краснодар, улица 1-я Линия Поймы реки Кубань, 2</option>
                <option>Краснодар, улица имени Тургенева, 135</option>
                <option>Краснодар, проспект Константина Образцова, 25к1</option>
                <option>Краснодар, улица Карякина, 5к2</option>
                <option>ст-ца Петровская, улица Димитрова, 27Б</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ваша оценка работы ПВЗ:</label>
            <div class="stars-container" id="star-rating">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <input type="hidden" id="rating-value" value="0">
        </div>

        <div class="form-group">
            <label for="phone">Номер телефона для связи:</label>
            <input type="tel" id="phone" class="form-control" placeholder="+7 (999) 123-45-67" maxlength="18" value="+7 ">
        </div>

        <div class="form-group">
            <label for="comment">Текст отзыва:</label>
            <textarea id="comment" class="form-control" placeholder="Напишите ваш отзыв..."></textarea>
        </div>

        <button class="submit-btn" onclick="submitReview()">Оставить отзыв</button>
    </div>

    <div id="toast" class="toast">Спасибо! Ваш отзыв отправлен.</div>
</div>

<script>
    const stars = document.querySelectorAll('.star');
    const ratingValue = document.getElementById('rating-value');
    const phoneInput = document.getElementById('phone');

    phoneInput.addEventListener('input', function (e) {
        let input = e.target.value;
        let numbers = input.replace(/\D/g, '');
        if (numbers.startsWith('8')) {
            numbers = '7' + numbers.slice(1);
        }
        if (!numbers.startsWith('7')) {
            numbers = '7' + numbers;
        }
        if (numbers.length > 11) {
            numbers = numbers.slice(0, 11);
        }
        let formatted = '+7 ';
        if (numbers.length > 1) {
            formatted += '(' + numbers.slice(1, 4);
        }
        if (numbers.length >= 5) {
            formatted += ') ' + numbers.slice(4, 7);
        }
        if (numbers.length >= 8) {
            formatted += '-' + numbers.slice(7, 9);
        }
        if (numbers.length >= 10) {
            formatted += '-' + numbers.slice(9, 11);
        }
        e.target.value = formatted;
    });

    phoneInput.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && phoneInput.value === '+7 ') {
            e.preventDefault();
        }
    });

    stars.forEach(star => {
        star.addEventListener('click', () => {
            const value = star.getAttribute('data-value');
            ratingValue.value = value;
            stars.forEach(s => s.classList.remove('active'));
            for(let i = 0; i < value; i++) {
                stars[i].classList.add('active');
            }
        });
    });

    function submitReview() {
        const city = document.getElementById('city').value;
        const rating = document.getElementById('rating-value').value;
        const phone = document.getElementById('phone').value;
        const comment = document.getElementById('comment').value;

        const phoneDigits = phone.replace(/\D/g, '');
        if (phoneDigits.length < 11) {
            alert("Пожалуйста, введите полный номер телефона.");
            return;
        }

        if (rating === "0") {
            alert("Пожалуйста, поставьте оценку (звезды).");
            return;
        }
        if (comment.trim() === "") {
            alert("Пожалуйста, напишите текст отзыва.");
            return;
        }

        const botToken = '8952031568:AAGhNVqTJ76vedw3KDn9Nl0d-1f6iFyaAO0';
        const chatId = '5778859190';

        const messageText = `📦 *Новый отзыв WB!*\n\n🏬 *ПВЗ:* ${city}\n⭐ *Оценка:* ${rating}/5\n📞 *Телефон:* ${phone}\n💬 *Отзыв:* ${comment}`;
        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chatId,
                text: messageText,
                parse_mode: 'Markdown'
            }),
        })
        .then(response => {
            if (response.ok) {
                const toast = document.getElementById("toast");
                toast.className = "toast show";
                
                document.getElementById('phone').value = "+7 ";
                document.getElementById('comment').value = "";
                document.getElementById('rating-value').value = "0";
                stars.forEach(s => s.classList.remove('active'));

                setTimeout(function(){ 
                    toast.className = toast.className.replace("show", ""); 
                }, 3000);
            } else {
                alert("Ошибка при отправке. Убедитесь, что ваш ID верный и вы нажали Start у бота.");
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            alert("Ошибка сети. Проверьте интернет.");
        });
    }
</script>

</body>
</html>
